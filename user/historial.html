<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Historial - LAVANDERIA ERP</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="main-header">
        <div class="header-container">
            <div class="logo-area">
                <span class="logo-icon">🌿</span>
                <span class="logo-text">LAVANDERIA</span>
            </div>
            <nav class="main-nav">
                <ul>
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="paquetes.html">Servicios</a></li>
                    <li><a href="sucursales.html">Sucursales</a></li>
                    <li><a href="dashboard.html" class="active-nav">Mi Cuenta</a></li>
                    <li><a href="contacto.html">Contacto</a></li>
                    <li><a href="nuevo-pedido.html" class="btn-nuevo-pedido">Nuevo pedido</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="full-history-main">
        <div class="history-header">
            <h1 class="main-title">Historial Completo de Pedidos</h1>
            <p>Consulta el detalle y estado de todos tus servicios anteriores y en curso.</p>
        </div>

        <div class="scrollable-table-wrapper">
            <table class="client-history-table">
                <thead>
                    <tr>
                        <th>ID Pedido</th>
                        <th>Servicio</th>
                        <th>Sucursal</th>
                        <th>Estado</th>
                        <th>Fecha</th>
                        <th style="text-align: center;">Acciones</th>
                    </tr>
                </thead>
                <tbody id="historial-tabla">
                    
                </tbody>
            </table>
        </div>
    </main>

<script>
// Función global para cargar el historial
async function cargarHistorial() {
    const idCliente = localStorage.getItem('id_cliente');
    if (!idCliente) {
        window.location.href = 'login.html';
        return;
    }

    try {
        const respuesta = await fetch(`/api/historial/${idCliente}`);
        const historial = await respuesta.json();

        if (respuesta.ok) {
            const tabla = document.getElementById('historial-tabla');
            tabla.innerHTML = ''; 

            if (historial.length === 0) {
                tabla.innerHTML = `<tr><td colspan="6" style="text-align: center;">Aún no tienes pedidos en tu historial.</td></tr>`;
            } else {
                historial.forEach(pedido => {
                    const fecha = new Date(pedido.fecha_recepcion).toLocaleDateString('es-MX');
                    
                    let badgeClass = 'status-badge';
                    if(pedido.estado_lavado === 'Entregado') badgeClass += ' badge-active'; 
                    
                    const fila = document.createElement('tr');
                    fila.innerHTML = `
                        <td><strong>P-${pedido.id_pedido.toString().padStart(3, '0')}</strong></td>
                        <td>${pedido.notas_especiales || 'Servicio General'}</td>
                        <td>${pedido.nombre_sucursal}</td>
                        <td><span class="${badgeClass}">${pedido.estado_lavado}</span></td>
                        <td>${fecha}</td>
                        <td style="text-align: center;">
                            <button onclick="cancelarPedido(${pedido.id_pedido})" style="background-color: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.85rem; transition: background 0.2s;">
                                Cancelar
                            </button>
                        </td>
                    `;
                    tabla.appendChild(fila);
                });
            }
        } else {
            alert("Error al cargar el historial.");
        }
    } catch (error) {
        console.error("Problema de conexión con el servidor:", error);
    }
}

// Cargar al iniciar la página
document.addEventListener('DOMContentLoaded', cargarHistorial);

// Función para eliminar el pedido permanentemente
async function cancelarPedido(idPedido) {
    if (!confirm(`¿Estás seguro de que deseas cancelar y eliminar permanentemente el pedido P-${idPedido.toString().padStart(3, '0')}? Esta acción no se puede deshacer.`)) {
        return;
    }

    try {
        const response = await fetch(`/api/historial/${idPedido}`, {
            method: 'DELETE'
        });

        const result = await response.json();

        if (response.ok && result.success) {
            alert(result.mensaje);
            cargarHistorial(); // Refresca la tabla automáticamente
        } else {
            alert(`Error: ${result.mensaje || 'No se pudo cancelar el pedido.'}`);
        }
    } catch (error) {
        console.error("Error en la petición:", error);
        alert("Ocurrió un error al intentar conectar con el servidor.");
    }
}
</script>
</body>
</html>
